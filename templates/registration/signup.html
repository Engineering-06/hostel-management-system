<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - Hostel Management</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg,#667eea,#764ba2);
        }

        .box {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,.25);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 7px 0 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #667eea;
            color: white;
            border: 0;
            border-radius: 8px;
            font-size: 16px;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #667eea;
            text-decoration: none;
        }

        ul {
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>?? Create Account</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Sign Up
        </button>
    </form>

    <a href="/login/">Already have an account? Login</a>

</div>

</body>
</html>
