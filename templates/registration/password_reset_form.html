<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>

    <style>
        body {
            margin:0;
            font-family:Arial;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:linear-gradient(135deg,#667eea,#764ba2);
        }

        .box {
            width:400px;
            background:white;
            padding:35px;
            border-radius:18px;
            box-shadow:0 20px 50px rgba(0,0,0,.25);
        }

        h2 { text-align:center; }

        p {
            color:#777;
            text-align:center;
        }

        input {
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ddd;
            border-radius:8px;
        }

        button {
            width:100%;
            padding:13px;
            border:0;
            border-radius:8px;
            background:#667eea;
            color:white;
            font-size:16px;
        }

        a {
            display:block;
            text-align:center;
            margin-top:18px;
            color:#667eea;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>?? Forgot Password?</h2>

    <p>Enter your registered email address.</p>

    <form method="post">
        {% csrf_token %}

        {{ form.email }}

        <button type="submit">
            Send Reset Link
        </button>
    </form>

    <a href="/login/">Back to Login</a>

</div>

</body>
</html>
