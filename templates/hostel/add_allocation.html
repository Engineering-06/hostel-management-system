<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Allocate Room</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .header {
            background: #20263e;
            color: white;
            padding: 20px 40px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
        }

        button {
            margin-top: 25px;
            padding: 12px 25px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .cancel {
            margin-left: 15px;
            text-decoration: none;
            color: #333;
        }

        .error {
            background: #ffdede;
            color: red;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h2>🏠 Hostel Management System</h2>
    </div>

    <div class="container">

        <div class="box">

            <h1>🏠 Allocate Room</h1>

            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <!-- STUDENT -->

                <label>Select Student</label>

                <select name="student" required>

                    <option value="">
                        -- Select Student --
                    </option>

                    {% for student in students %}

                    <option value="{{ student.id }}">
                        {{ student.student_id }} - {{ student.name }}
                    </option>

                    {% endfor %}

                </select>


                <!-- ROOM -->

                <label>Select Room</label>

                <select name="room" required>

                    <option value="">
                        -- Select Room --
                    </option>

                    {% for room in rooms %}

                    <option value="{{ room.id }}">
                        Room {{ room.room_number }}
                        (Capacity: {{ room.capacity }})
                    </option>

                    {% endfor %}

                </select>


                <button type="submit">
                    ✅ Allocate Room
                </button>

                <a href="/allocations/" class="cancel">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</body>
</html>
