<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Room - Hostel Management</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f9;
        }

        .header {
            background: #20263e;
            color: white;
            padding: 18px 40px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }

        button {
            padding: 12px 25px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .cancel {
            text-decoration: none;
            padding: 12px 25px;
            background: #ddd;
            color: black;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h2>🏠 Hostel Management System</h2>
    </div>

    <div class="container">

        <div class="form-box">

            <h1>➕ Add New Room</h1>

            <form method="POST">

                {% csrf_token %}

                <label>Room Number</label>
                <input type="text"
                       name="room_number"
                       placeholder="Enter Room Number"
                       required>

                <label>Room Capacity</label>
                <input type="number"
                       name="capacity"
                       placeholder="Enter Capacity"
                       min="1"
                       required>

                <label>Room Status</label>

                <select name="status" required>
                    <option value="Available">🟢 Available</option>
                    <option value="Occupied">🔴 Occupied</option>
                </select>

                <div class="buttons">

                    <button type="submit">
                        ➕ Add Room
                    </button>

                    <a href="/rooms/" class="cancel">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
