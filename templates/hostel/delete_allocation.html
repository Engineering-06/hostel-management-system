<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Remove Room Allocation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            text-align: center;
            padding-top: 100px;
        }

        .box {
            background: white;
            width: 500px;
            max-width: 90%;
            margin: auto;
            padding: 35px;
            border-radius: 10px;
        }

        button {
            padding: 12px 25px;
            border: none;
            cursor: pointer;
            background: #dc3545;
            color: white;
            border-radius: 5px;
            font-size: 16px;
        }

        .cancel {
            display: inline-block;
            text-decoration: none;
            padding: 12px 25px;
            background: #ddd;
            color: black;
            margin-left: 10px;
            border-radius: 5px;
        }
    </style>

</head>

<body>

    <div class="box">

        <h2>🗑️ Remove Room Allocation?</h2>

        <p>
            Are you sure you want to remove Room
            <strong>{{ allocation.room.room_number }}</strong>
            from
            <strong>{{ allocation.student.name }}</strong>?
        </p>

        <form method="POST">

            {% csrf_token %}

            <button type="submit">
                Yes, Remove
            </button>

            <a href="/allocations/" class="cancel">
                Cancel
            </a>

        </form>

    </div>

</body>
</html>
