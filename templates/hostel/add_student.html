<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .header {
            background: #20263e;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
        }

        .header a {
            color: white;
            text-decoration: none;
            background: #667eea;
            padding: 10px 20px;
            border-radius: 6px;
        }

        .container {
            width: 600px;
            margin: 40px auto;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            margin-top: 25px;
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .cancel {
            margin-left: 10px;
            background: #777;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="header">

    <h2>🏠 Hostel Management</h2>

    <a href="/students/">Students</a>

</div>

<div class="container">

    <div class="form-box">

        <h1>➕ Add New Student</h1>

        <form method="POST">

            {% csrf_token %}

            <label>Student ID</label>
            <input type="text" name="student_id" required>

            <label>Name</label>
            <input type="text" name="name" required>

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Phone</label>
            <input type="text" name="phone" required>

            <label>Course</label>
            <input type="text" name="course" required>

            <label>Branch</label>
            <input type="text" name="branch" required>
<label>Year</label>
<input type="text" name="year" placeholder="e.g. 3rd Year" required>

            <button type="submit">
                Add Student
            </button>

            <a href="/students/" class="cancel">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
